<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OC Networks LLC | Interactive Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050507;
            --surface: #121217;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --border: #27272a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            overflow: hidden; /* Keeps items contained to a draggable canvas */
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Fixed Minimalist Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2.5rem 3rem;
            z-index: 1000;
            pointer-events: none; /* Allows clicking through empty space */
        }

        header a, header .logo {
            pointer-events: auto; /* Re-enables clicking on links */
        }

        .logo {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.01em;
        }

        nav {
            display: flex;
            gap: 2.5rem;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--text-primary);
        }

        /* Interactive Draggable Canvas Area */
        .canvas {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: grab;
        }

        .canvas:active {
            cursor: grabbing;
        }

        /* Draggable Cards / Portfolio Elements */
        .draggable-card {
            position: absolute;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            width: 260px;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: grab;
            transition: border-color 0.2s, box-shadow 0.2s;
            /* Initial random-ish placement values handled via inline style or JS */
        }

        .draggable-card:active {
            cursor: grabbing;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            border-color: #3f3f46;
            z-index: 999;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .card-tag {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Center brand watermark text like the reference site */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(3rem, 8vw, 7rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.03);
            pointer-events: none;
            text-align: center;
            letter-spacing: -0.03em;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">OC Networks LLC</a>
        <nav>
            <a href="#work">Works</a>
            <a href="mailto:ocnetworksllc@gmail.com">Contact</a>
        </nav>
    </header>

    <div class="watermark">oc networks.</div>

    <div class="canvas" id="canvas">
        <!-- Draggable Interactive Elements -->
        <div class="draggable-card" style="top: 25vh; left: 15vw;" data-x="0" data-y="0">
            <span class="card-tag">Infrastructure</span>
            <div class="card-title">Project Showcase 01</div>
        </div>

        <div class="draggable-card" style="top: 55vh; left: 25vw;" data-x="0" data-y="0">
            <span class="card-tag">Hardware</span>
            <div class="card-title">Edge Node Deploy 02</div>
        </div>

        <div class="draggable-card" style="top: 30vh; left: 60vw;" data-x="0" data-y="0">
            <span class="card-tag">Networking</span>
            <div class="card-title">Topology Map 03</div>
        </div>

        <div class="draggable-card" style="top: 60vh; left: 65vw;" data-x="0" data-y="0">
            <span class="card-tag">Operations</span>
            <div class="card-title">Field Systems 04</div>
        </div>
    </div>

    <script>
        // Simple drag-and-drop mechanics for the portfolio cards
        const cards = document.querySelectorAll('.draggable-card');

        cards.forEach(card => {
            let isDragging = false;
            let startX, startY;
            let currentX = 0;
            let currentY = 0;

            card.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX - currentX;
                startY = e.clientY - currentY;
                card.style.zIndex = 1000;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                currentX = e.clientX - startX;
                currentY = e.clientY - startY;
                card.style.transform = `translate(${currentX}px, ${currentY}px)`;
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
                card.style.zIndex = 1;
            });

            // Touch support for mobile/tablets
            card.addEventListener('touchstart', (e) => {
                isDragging = true;
                startX = e.touches[0].clientX - currentX;
                startY = e.touches[0].clientY - currentY;
                card.style.zIndex = 1000;
            });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                currentX = e.touches[0].clientX - startX;
                currentY = e.touches[0].clientY - startY;
                card.style.transform = `translate(${currentX}px, ${currentY}px)`;
            }, { passive: true });

            window.addEventListener('touchend', () => {
                isDragging = false;
                card.style.zIndex = 1;
            });
        });
    </script>

</body>
</html>
