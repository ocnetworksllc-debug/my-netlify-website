<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OC Networks LLC | Cyber Interactive Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030305;
            --surface: rgba(18, 18, 23, 0.75);
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Canvas for Particle Grid Animation */
        #fx-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Fixed Minimalist Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2.5rem 3rem;
            z-index: 1000;
            pointer-events: none;
        }

        header a, header .logo {
            pointer-events: auto;
        }

        .logo {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.01em;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        nav {
            display: flex;
            gap: 2.5rem;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s, text-shadow 0.2s;
        }

        nav a:hover {
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* Interactive Draggable Canvas Area */
        .canvas {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
        }

        /* Draggable Cards / Portfolio Elements with Glassmorphism */
        .draggable-card {
            position: absolute;
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.8rem;
            width: 280px;
            height: 190px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            cursor: grab;
            transition: border-color 0.3s, box-shadow 0.3s;
            will-change: transform;
        }

        .draggable-card:hover {
            border-color: var(--accent);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 25px var(--accent-glow);
        }

        .draggable-card:active {
            cursor: grabbing;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .card-tag {
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

       /* Ambient Pulsing Watermark */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(2rem, 7vw, 7.5rem); /* Adjusted size to prevent wide wrapping */
            font-weight: 300;
            color: rgba(255, 255, 255, 0.08);
            pointer-events: none;
            text-align: center;
            letter-spacing: -0.04em;
            white-space: nowrap; /* Forces text to stay on a single line */
            z-index: 2;
            animation: pulseGlow 6s ease-in-out infinite alternate;
        }
        
        @keyframes pulseGlow {
            0% { opacity: 0.5; text-shadow: 0 0 10px rgba(56,189,248,0); }
            0% { opacity: 1; text-shadow: 0 0 30px rgba(56,189,248,0.15); }
        }*
    </style>
</head>
<body>

    <!-- Interactive Particle Background FX -->
    <canvas id="fx-canvas"></canvas>

    <header>
        <a href="#" class="logo">OC Networks LLC</a>
        <nav>
            <a href="#work">Works</a>
            <a href="mailto:ocnetworksllc@gmail.com">Contact</a>
        </nav>
    </header>

    <div class="watermark">oc networks.</div>

    <div class="canvas" id="canvas">
        <!-- Draggable Interactive Elements -->
        <div class="draggable-card" style="top: 22vh; left: 22vw;" data-x="0" data-y="0">
            <span class="card-tag">// Infrastructure</span>
            <div class="card-title">Project Showcase 01</div>
        </div>

        <div class="draggable-card" style="top: 55vh; left: 28vw;" data-x="0" data-y="0">
            <span class="card-tag">// Hardware</span>
            <div class="card-title">Edge Node Deploy 02</div>
        </div>

        <div class="draggable-card" style="top: 28vh; left: 60vw;" data-x="0" data-y="0">
            <span class="card-tag">// Networking</span>
            <div class="card-title">Topology Map 03</div>
        </div>

        <div class="draggable-card" style="top: 58vh; left: 62vw;" data-x="0" data-y="0">
            <span class="card-tag">// Operations</span>
            <div class="card-title">Field Systems 04</div>
        </div>
    </div>

    <script>
        // --- 1. INTERACTIVE PARTICLE & GLOW NETWORK FX ---
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2, radius: 150 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.baseX = this.x;
                this.baseY = this.y;
                this.size = Math.random() * 1.5 + 0.5;
                this.density = (Math.random() * 20) + 5;
            }
            update() {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let forceDirectionX = dx / distance;
                let forceDirectionY = dy / distance;
                let maxDistance = mouse.radius;
                let force = (maxDistance - distance) / maxDistance;
                let directionX = forceDirectionX * force * this.density;
                let directionY = forceDirectionY * force * this.density;

                if (distance < mouse.radius) {
                    this.x -= directionX;
                    this.y -= directionY;
                } else {
                    if (this.x !== this.baseX) {
                        let dx = this.x - this.baseX;
                        this.x -= dx / 15;
                    }
                    if (this.y !== this.baseY) {
                        let dy = this.y - this.baseY;
                        this.y -= dy / 15;
                    }
                }
            }
            draw() {
                ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            let numberOfParticles = (width * height) / 9000;
            for (let i = 0; i < numberOfParticles; i++) {
                particles.push(new Particle());
            }
        }
        initParticles();

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();


        // --- 2. ADVANCED DRAG & MOMENTUM PHYSICS FOR CARDS ---
        const cards = document.querySelectorAll('.draggable-card');

        cards.forEach(card => {
            let isDragging = false;
            let startX, startY;
            let currentX = 0, currentY = 0;
            let targetX = 0, targetY = 0;
            let velocityX = 0, velocityY = 0;
            let lastMouseX = 0, lastMouseY = 0;

            card.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX - targetX;
                startY = e.clientY - targetY;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                card.style.zIndex = 1000;
                card.style.transition = 'none';
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                targetX = e.clientX - startX;
                targetY = e.clientY - startY;

                velocityX = e.clientX - lastMouseX;
                velocityY = e.clientY - lastMouseY;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;

                // Dynamic tilt effect based on movement speed
                let tiltX = velocityY * 0.4;
                let tiltY = -velocityX * 0.4;

                card.style.transform = `translate(${targetX}px, ${targetY}px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) scale(1.03)`;
            });

            window.addEventListener('mouseup', () => {
                if (!isDragging) return;
                isDragging = false;
                card.style.zIndex = 10;
                card.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)'; // Spring bounce effect
                
                // Release with smooth dampening
                targetX += velocityX * 4;
                targetY += velocityY * 4;
                card.style.transform = `translate(${targetX}px, ${targetY}px) rotateX(0deg) rotateY(0deg) scale(1)`;
                currentX = targetX;
                currentY = targetY;
            });

            // Touch support
            card.addEventListener('touchstart', (e) => {
                isDragging = true;
                startX = e.touches[0].clientX - targetX;
                startY = e.touches[0].clientY - targetY;
                card.style.zIndex = 1000;
                card.style.transition = 'none';
            });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                targetX = e.touches[0].clientX - startX;
                targetY = e.touches[0].clientY - startY;
                card.style.transform = `translate(${targetX}px, ${targetY}px) scale(1.03)`;
            }, { passive: true });

            window.addEventListener('touchend', () => {
                if (!isDragging) return;
                isDragging = false;
                card.style.zIndex = 10;
                card.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                card.style.transform = `translate(${targetX}px, ${targetY}px) scale(1)`;
            });
        });
    </script>
</body>
</html>
