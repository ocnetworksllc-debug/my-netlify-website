<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OC Networks LLC | Portfolio & Infrastructure</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --surface: #121215;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --border: #27272a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 0 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3rem 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 4rem;
        }

        .logo {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-primary);
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 2rem;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--text-primary);
        }

        .hero {
            padding: 2rem 0 4rem 0;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 400;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 1.5rem;
        }

        .hero h1 span {
            color: var(--text-secondary);
        }

        /* Dynamic Media/Portfolio Grid Layout */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 6rem;
        }

        .gallery-item {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .gallery-item:hover {
            border-color: #3f3f46;
            transform: translateY(-4px);
        }

        .gallery-placeholder {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-align: center;
            padding: 1rem;
        }

        footer {
            padding: 3rem 0;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 600px) {
            footer {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <a href="#" class="logo">OC Networks LLC</a>
            <nav>
                <a href="#videos">Videos</a>
                <a href="#photos">Photos</a>
                <a href="mailto:ocnetworksllc@gmail.com">About</a>
            </nav>
        </header>

        <main>
            <section class="hero">
                <h1>Visualizing infrastructure. <span>Curated works & projects.</span></h1>
            </section>

            <div class="gallery-grid" id="photos">
                <!-- Replace these blocks with your images or video embeds later -->
                <div class="gallery-item">
                    <div class="gallery-placeholder">Project Showcase 01</div>
                </div>
                <div class="gallery-item">
                    <div class="gallery-placeholder">Hardware Setup 02</div>
                </div>
                <div class="gallery-item">
                    <div class="gallery-placeholder">Network Topology 03</div>
                </div>
                <div class="gallery-item">
                    <div class="gallery-placeholder">Field Operations 04</div>
                </div>
                <div class="gallery-item">
                    <div class="gallery-placeholder">Systems Deploy 05</div>
                </div>
                <div class="gallery-item">
                    <div class="gallery-placeholder">Infrastructure 06</div>
                </div>
            </div>
        </main>

        <footer>
            <div>&copy; 2026 OC Networks LLC. All rights reserved.</div>
            <div>Built with precision.</div>
        </footer>
    </div>

</body>
</html>
